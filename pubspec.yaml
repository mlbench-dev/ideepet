name: idee_pet
description: "A new Flutter project."
publish_to: "none"

version: 100.1.0+100015

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  provider: ^6.1.2
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3
  # permission_handler: ^11.3.1
  permission_handler: ^12.0.3
  awesome_dialog: ^3.3.0
  google_fonts: ^6.2.1
  dio: ^5.7.0
  get_it: ^8.0.3
  shared_preferences: ^2.4.0
  smooth_page_indicator: ^1.2.0+3
  dropdown_search: ^6.0.2
  # skeletonizer: ^1.4.3
  skeletonizer: ^2.1.3
  camera: ^0.11.4
  image_picker: ^1.1.2
  flutter_floating_bottom_bar: ^1.2.1+1
  # intl: ^0.19.0
  intl: ^0.20.2
  table_calendar: ^3.1.0
  image: ^4.5.3
  lottie: ^3.3.1
  get: ^4.7.2
  jwt_decoder: 2.0.1
  package_info_plus: ^8.3.0
  brasil_fields: ^1.15.0
  firebase_crashlytics: ^4.1.0
  firebase_analytics: ^11.4.4
  firebase_core: ^3.12.1
  # flutter_osm_plugin: ^1.3.7
  flutter_osm_plugin: ^1.4.6
  geolocator: ^13.0.4
  tflite_flutter: ^0.12.1
  easy_image_cropper: ^1.0.3
  exif: ^3.1.4
  audioplayers: ^6.5.1
  video_player: ^2.14.0
  flutter_branch_sdk: ^9.3.5
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.14

dependency_overrides:
  # easy_image_cropper 1.0.3 (pub.dev) ships Android code that references the
  # removed Flutter v1 embedding (PluginRegistry.Registrar), so it fails to
  # compile on modern Flutter. Patched local copy at packages/easy_image_cropper.
  easy_image_cropper:
    path: packages/easy_image_cropper

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false

  assets:
    - assets/
    - assets/onboarding/
    - assets/onboarding_biometric/
    - assets/onboarding_biometric/how_to_do/
    - assets/onboarding_biometric/how_to_read/
    - assets/onboarding_biometric/reading_examples/
    - assets/onboarding_biometric/camera_permission/
    - assets/onboarding_biometric/retry_reading/
    - assets/notification/
    - assets/home/
    - assets/base/
    - assets/health/
    - assets/account_general/
    - assets/wallet/
    - assets/tflite/
    - assets/tflite/model.tflite
    - assets/tflite/labels.txt
    - assets/new_password_success/
    - assets/club/
    - assets/find_pet/
    - assets/edit/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/PoppinsExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins/PoppinsSemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/PoppinsMedium.ttf
          weight: 400
        - asset: assets/fonts/Poppins/PoppinsLight.ttf
          weight: 200

    - family: NewKansas
      fonts:
        - asset: assets/fonts/NewKansas/NewKansasRegular.otf
          weight: 400
        - asset: assets/fonts/NewKansas/NewKansasMedium.otf
          weight: 500
        - asset: assets/fonts/NewKansas/NewKansasBold.otf
          weight: 700
        - asset: assets/fonts/NewKansas/NewKansasBlack.otf
          weight: 900

    - family: Mulish
      fonts:
        - asset: assets/fonts/Mulish/MulishBold.ttf
          weight: 700
        - asset: assets/fonts/Mulish/MulishRegular.ttf
          weight: 400

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/RobotoMedium.ttf
          weight: 500

    - family: Monstserrat
      fonts:
        - asset: assets/fonts/Montserrat/MontserratSemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
